version: '3.8'

services:

  # ---------- Databases ----------

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5433:5432"

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: productsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5434:5432"

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5435:5432"

  # ---------- Kafka ----------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------- Core services ----------

  eureka-server:
    build: ./eureka-server/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway/api-gateway
    container_name: api-gateway
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      EUREKA_HOST: eureka-server

  user-service:
    build: ./user-service/user-service
    container_name: user-service
    depends_on:
      - eureka-server
      - user-db
    environment:
      DB_HOST: user-db
      EUREKA_HOST: eureka-server

  product-service:
    build: ./product-service/product-service
    container_name: product-service
    depends_on:
      - eureka-server
      - product-db
    environment:
      DB_HOST: product-db
      EUREKA_HOST: eureka-server

  order-service:
    build: ./order-service/order-service
    container_name: order-service
    depends_on:
      - eureka-server
      - order-db
      - kafka
    environment:
      DB_HOST: order-db
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP: kafka:29092

  notification-service:
    build: ./notification-service/notification-service
    container_name: notification-service
    depends_on:
      - eureka-server
      - kafka
    environment:
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP: kafka:29092